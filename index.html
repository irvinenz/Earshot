      --ink:#E9EFEC; --ink-soft:#93A39D; --line:#273236;
      --live:#5BC8D2; --live-soft:#14272B; --danger:#E08472; --danger-soft:#2C1C19;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0F1417; --surface:#171E21; --surface-2:#1E272B;
    --ink:#E9EFEC; --ink-soft:#93A39D; --line:#273236;
    --live:#5BC8D2; --live-soft:#14272B; --danger:#E08472; --danger-soft:#2C1C19;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  body {
    margin: 0; height: 100%;
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--ink);
    font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--live); outline-offset: 2px; border-radius: 4px; }

  /* ---------- header ---------- */
  header {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .status { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1; }
  .dot { width: 13px; height: 13px; border-radius: 50%; background: var(--line); flex: 0 0 auto; }
  .listening .dot { background: var(--live); }
  .hearing .dot { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1 } 50% { transform: scale(1.5); opacity: .55 } }
  @media (prefers-reduced-motion: reduce) { .hearing .dot { animation: none; box-shadow: 0 0 0 5px var(--live-soft) } }
  .status-text { font-size: 16px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .listening .status-text { color: var(--live); font-weight: 700; }

  .tool {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
    min-width: 42px; height: 40px; padding: 0 10px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .tool:hover { border-color: var(--ink-soft); }
  .tool.a-minus { font-size: 14px; font-weight: 700; }
  .tool.a-plus { font-size: 21px; font-weight: 700; }

  /* ---------- settings ---------- */
  .settings {
    flex: 0 0 auto; display: none;
    padding: 14px; gap: 14px; flex-wrap: wrap; align-items: flex-end;
    background: var(--surface-2); border-bottom: 1px solid var(--line);
  }
  .settings.open { display: flex; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field span { font-size: 13px; color: var(--ink-soft); }
  select {
    font: inherit; font-size: 15px; padding: 9px 10px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }

  /* ---------- transcript ---------- */
  main { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; position: relative; -webkit-overflow-scrolling: touch; }
  .page { max-width: 44rem; margin: 0 auto; padding: 22px 18px 34px; }

  .block {
    font-size: var(--ts); line-height: 1.45; margin: 0 0 0.85em;
    max-width: 34em; overflow-wrap: break-word;
  }
  .block .time {
    display: block; font-size: 13px; line-height: 1.4; color: var(--ink-soft);
    margin-bottom: 2px; font-weight: 400;
  }
  .live {
    font-size: var(--ts); line-height: 1.45; color: var(--live);
    border-left: 4px solid var(--live); padding-left: 12px; margin: 0;
    max-width: 34em; overflow-wrap: break-word; min-height: 1.45em;
  }

  .empty { max-width: 30rem; }
  .empty h1 { font-size: 27px; line-height: 1.25; margin: 6px 0 12px; font-weight: 700; }
  .empty p { font-size: 18px; line-height: 1.55; color: var(--ink-soft); margin: 0 0 12px; }

  .notice {
    border-left: 4px solid var(--danger); background: var(--danger-soft);
    padding: 14px 16px; border-radius: 0 10px 10px 0; margin: 0 0 18px;
    font-size: 17px; line-height: 1.5; max-width: 34em;
  }
  .notice strong { display: block; margin-bottom: 4px; }

  .jump {
    position: sticky; bottom: 8px; float: right; margin-right: 4px;
    background: var(--live); color: var(--surface); border: none;
    border-radius: 999px; padding: 10px 18px; font-size: 15px; font-weight: 700;
    box-shadow: 0 4px 14px rgba(0,0,0,.22); display: none;
  }
  .jump.show { display: block; }

  /* ---------- review + saved ---------- */
  h2 { font-size: 22px; margin: 0 0 4px; }
  .meta { font-size: 15px; color: var(--ink-soft); margin: 0 0 20px; }

  .saved-item {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 12px; max-width: 34em;
  }
  .saved-item h3 { font-size: 17px; margin: 0 0 4px; }
  .saved-item .snip { font-size: 16px; color: var(--ink-soft); line-height: 1.5; margin: 0 0 10px; }
  .saved-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .mini {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px;
    padding: 8px 14px; font-size: 15px;
  }
  .mini.warn { color: var(--danger); border-color: var(--danger); background: transparent; }
  .fold { display: none; }
  .fold.open { display: block; }
  .fold p { font-size: 18px; line-height: 1.5; margin: 0 0 10px; }

  /* ---------- footer ---------- */
  footer {
    flex: 0 0 auto;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 14px;
  }
  .actions { max-width: 44rem; margin: 0 auto; display: flex; gap: 12px; }
  .btn {
    flex: 1; min-height: 62px; border-radius: 14px; border: 2px solid transparent;
    font-size: 19px; font-weight: 700; line-height: 1.25;
    display: inline-flex; align-items: center; justify-content: center; text-align: center;
    padding: 10px 14px;
  }
  .btn.primary { background: var(--live); color: var(--bg); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.quiet { background: var(--surface-2); border-color: var(--line); color: var(--ink); }
  .btn.quiet:hover { border-color: var(--ink-soft); }
  .btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  .btn.danger:hover { background: var(--danger-soft); }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .footnote { max-width: 44rem; margin: 10px auto 0; font-size: 13px; color: var(--ink-soft); text-align: center; }
</style>
</head>
<body>

<header id="header">
  <div class="status">
    <span class="dot" aria-hidden="true"></span>
    <span class="status-text" id="statusText">Ready</span>
  </div>
  <button class="tool a-minus" id="smaller" title="Smaller text" aria-label="Smaller text">A</button>
  <button class="tool a-plus" id="bigger" title="Bigger text" aria-label="Bigger text">A</button>
  <button class="tool" id="gear" title="Settings" aria-label="Settings" aria-expanded="false">&#9881;</button>
</header>

<div class="settings" id="settings">
  <label class="field">
    <span>Spoken language</span>
    <select id="lang">
      <option value="en-NZ">English (New Zealand)</option>
      <option value="en-AU">English (Australia)</option>
      <option value="en-GB">English (UK)</option>
      <option value="en-US">English (US)</option>
      <option value="mi-NZ">Māori</option>
      <option value="fr-FR">French</option>
      <option value="de-DE">German</option>
      <option value="es-ES">Spanish</option>
    </select>
  </label>
  <label class="field">
    <span>Appearance</span>
    <select id="theme">
      <option value="auto">Match my device</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </label>
  <button class="mini" id="viewSaved">Kept conversations</button>
</div>

<main id="main">
  <div class="page" id="page"></div>
</main>

<footer>
  <div class="actions" id="actions"></div>
  <p class="footnote" id="footnote"></p>
</footer>

<script>
(function () {
  "use strict";

  var PREFS_KEY = "earshot:prefs";
  var SAVED_KEY = "earshot:saved";

  function loadJSON(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }
  function saveJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch (e) { return false; }
  }

  var prefs = loadJSON(PREFS_KEY, {}) || {};
  if (typeof prefs.size !== "number") prefs.size = 30;
  if (!prefs.lang) prefs.lang = "en-NZ";
  if (!prefs.theme) prefs.theme = "auto";

  var header = document.getElementById("header");
  var statusText = document.getElementById("statusText");
  var page = document.getElementById("page");
  var main = document.getElementById("main");
  var actions = document.getElementById("actions");
  var footnote = document.getElementById("footnote");
  var settings = document.getElementById("settings");
  var gear = document.getElementById("gear");
  var langSel = document.getElementById("lang");
  var themeSel = document.getElementById("theme");

  function applyPrefs() {
    document.documentElement.style.setProperty("--ts", prefs.size + "px");
    if (prefs.theme === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", prefs.theme);
    langSel.value = prefs.lang;
    themeSel.value = prefs.theme;
    saveJSON(PREFS_KEY, prefs);
  }

  /* ---------------- state ---------------- */
  var VIEW = "idle";        // idle | listening | review | saved
  var blocks = [];          // [{ t, text }]
  var startedAt = null;
  var endedAt = null;
  var lastFinalAt = 0;
  var GAP_MS = 3000;
  var interim = "";
  var micBlocked = false;
  var netProblem = false;
  var stickToBottom = true;

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recog = null;
  var wantListening = false;
  var restarts = 0;
  var restartWindowStart = 0;

  /* ---------------- helpers ---------------- */
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function clockTime(ms) {
    try { return new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
    catch (e) { return ""; }
  }
  function fullDate(ms) {
    try {
      return new Date(ms).toLocaleString([], {
        weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit"
      });
    } catch (e) { return ""; }
  }
  function joinBlocks(list) {
    return (list || []).map(function (b) { return b.text; }).join(" ");
  }
  function wordCount(text) {
    var t = (text || "").trim();
    return t ? t.split(/\s+/).length : 0;
  }
  function durationLabel(a, b) {
    var secs = Math.max(0, Math.round(((b || Date.now()) - a) / 1000));
    if (secs < 60) return secs + " sec";
    var mins = Math.round(secs / 60);
    return mins + (mins === 1 ? " min" : " mins");
  }
  function setStatus(text, mode) {
    statusText.textContent = text;
    header.classList.toggle("listening", mode === "listening" || mode === "hearing");
    header.classList.toggle("hearing", mode === "hearing");
  }

  /* ---------------- speech recognition ---------------- */
  // One recognizer for the life of the page. iOS plays a chime every time a
  // new one is constructed, so it is built once and reused.
  function getRecognizer() {
    if (recog) return recog;
    var r = new SR();
    recog = r;
    r.continuous = true;
    r.interimResults = true;
    r.lang = prefs.lang;
    r.maxAlternatives = 1;

    r.onresult = function (ev) {
      var pending = "";
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        var res = ev.results[i];
        var chunk = (res[0] && res[0].transcript) || "";
        if (res.isFinal) addFinal(chunk);
        else pending += chunk;
      }
      interim = pending.trim();
      renderTranscript();
    };

    r.onspeechstart = function () { if (wantListening) setStatus("Hearing speech", "hearing"); };
    r.onspeechend = function () { if (wantListening) setStatus("Listening", "listening"); };

    r.onerror = function (ev) {
      if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
        micBlocked = true;
        stopListening();
        render();
      } else if (ev.error === "network") {
        netProblem = true;
        render();
      }
      // "no-speech" and "aborted" are normal; onend restarts us.
    };

    r.onend = function () {
      if (!wantListening) return;
      var now = Date.now();
      if (now - restartWindowStart > 10000) { restartWindowStart = now; restarts = 0; }
      restarts++;
      if (restarts > 25) {
        wantListening = false;
        setStatus("Stopped — tap resume", "");
        render();
        return;
      }
      try { r.start(); } catch (e) { /* already starting */ }
    };

    return r;
  }

  function addFinal(chunk) {
    var text = chunk.replace(/\s+/g, " ").trim();
    if (!text) return;
    var now = Date.now();
    var last = blocks[blocks.length - 1];
    if (last && now - lastFinalAt < GAP_MS) {
      last.text = (last.text + " " + text).replace(/\s+/g, " ");
    } else {
      blocks.push({ t: now, text: text });
    }
    lastFinalAt = now;
  }

  function startListening() {
    if (!SR) return;
    micBlocked = false;
    netProblem = false;
    if (!blocks.length) { startedAt = Date.now(); endedAt = null; }
    wantListening = true;
    restarts = 0;
    restartWindowStart = Date.now();
    var r = getRecognizer();
    r.lang = prefs.lang;
    try { r.start(); } catch (e) { /* already running */ }
    VIEW = "listening";
    setStatus("Listening", "listening");
    stickToBottom = true;
    render();
  }

  function stopListening() {
    wantListening = false;
    if (recog) { try { recog.stop(); } catch (e) {} }
    if (interim) { addFinal(interim); interim = ""; }
    setStatus("Paused", "");
  }

  /* ---------------- keep / delete ---------------- */
  function keepConversation() {
    var list = loadJSON(SAVED_KEY, []) || [];
    list.unshift({
      id: String(Date.now()),
      startedAt: startedAt,
      endedAt: endedAt || Date.now(),
      blocks: blocks.slice()
    });
    if (list.length > 60) list = list.slice(0, 60);
    var ok = saveJSON(SAVED_KEY, list);
    resetConversation();
    VIEW = "saved";
    render();
    if (!ok) {
      page.insertBefore(
        el("p", "notice", "This browser would not let the conversation be stored."),
        page.firstChild
      );
    }
  }

  function deleteConversation() {
    resetConversation();
    VIEW = "idle";
    render();
  }

  function resetConversation() {
    blocks = [];
    interim = "";
    startedAt = null;
    endedAt = null;
    lastFinalAt = 0;
    setStatus("Ready", "");
  }

  /* ---------------- rendering ---------------- */
  function renderTranscript() {
    if (VIEW !== "listening") return;
    var wrap = document.getElementById("stream");
    if (!wrap) { render(); return; }
    wrap.innerHTML = "";
    blocks.forEach(function (b) {
      var p = el("p", "block");
      p.appendChild(el("span", "time", clockTime(b.t)));
      p.appendChild(document.createTextNode(b.text));
      wrap.appendChild(p);
    });
    wrap.appendChild(el("p", "live", interim));
    if (stickToBottom) main.scrollTop = main.scrollHeight;
  }

  function noticeEl(title, body) {
    var n = el("div", "notice");
    n.appendChild(el("strong", null, title));
    n.appendChild(document.createTextNode(body));
    return n;
  }

  function micNotice() {
    return noticeEl(
      "The microphone was blocked",
      "Allow the microphone for this page, then start again. If there was no prompt, open this page in its " +
      "own browser tab — a page shown inside another page is often refused the microphone."
    );
  }

  function render() {
    page.innerHTML = "";
    actions.innerHTML = "";
    footnote.textContent = "";

    if (!SR) {
      page.appendChild(noticeEl(
        "This browser cannot listen",
        "Live captioning needs Chrome or Edge on a computer, Safari on iPhone or iPad, or Chrome on Android. " +
        "Firefox does not provide the speech recognition this page relies on."
      ));
      return;
    }

    if (VIEW === "idle") return renderIdle();
    if (VIEW === "listening") return renderListening();
    if (VIEW === "review") return renderReview();
    if (VIEW === "saved") return renderSaved();
  }

  function renderIdle() {
    if (micBlocked) page.appendChild(micNotice());
    var box = el("div", "empty");
    box.appendChild(el("h1", null, "Let them speak. Read it here."));
    box.appendChild(el("p", null,
      "Start listening, then put the phone between you and whoever is talking. Their words appear below in " +
      "large print as they are said."));
    box.appendChild(el("p", null,
      "When you finish, you can read the whole conversation back, then keep it or throw it away."));
    page.appendChild(box);

    var start = el("button", "btn primary", "Start listening");
    start.onclick = startListening;
    actions.appendChild(start);

    var saved = (loadJSON(SAVED_KEY, []) || []).length;
    if (saved) {
      var view = el("button", "btn quiet", saved === 1 ? "1 kept conversation" : saved + " kept conversations");
      view.onclick = function () { VIEW = "saved"; render(); };
      actions.appendChild(view);
    }
    footnote.textContent = "Transcripts stay in this browser, on this phone.";
  }

  function renderListening() {
    if (micBlocked) page.appendChild(micNotice());
    if (netProblem) page.appendChild(noticeEl(
      "The connection dropped",
      "Speech recognition needs the internet. Check the connection — listening will pick up again by itself."
    ));

    var stream = el("div");
    stream.id = "stream";
    page.appendChild(stream);

    var jump = el("button", "jump", "Jump to latest");
    jump.id = "jump";
    jump.onclick = function () {
      stickToBottom = true;
      main.scrollTop = main.scrollHeight;
      jump.classList.remove("show");
    };
    page.appendChild(jump);

    renderTranscript();

    if (wantListening) {
      var pause = el("button", "btn quiet", "Pause");
      pause.onclick = function () { stopListening(); render(); };
      actions.appendChild(pause);
    } else {
      var resume = el("button", "btn quiet", "Resume listening");
      resume.onclick = startListening;
      actions.appendChild(resume);
    }

    var finish = el("button", "btn primary", "End conversation");
    finish.onclick = function () {
      stopListening();
      endedAt = Date.now();
      VIEW = "review";
      stickToBottom = false;
      render();
      main.scrollTop = 0;
    };
    if (!blocks.length && !interim) finish.disabled = true;
    actions.appendChild(finish);

    footnote.textContent = "A long silence starts a new paragraph.";
  }

  function renderReview() {
    var text = joinBlocks(blocks);
    page.appendChild(el("h2", null, "Conversation ended"));
    page.appendChild(el("p", "meta",
      fullDate(startedAt || Date.now()) + " · " + durationLabel(startedAt || Date.now(), endedAt) +
      " · " + wordCount(text) + " words"));

    if (!blocks.length) {
      page.appendChild(el("p", "meta", "Nothing was captured."));
    }
    blocks.forEach(function (b) {
      var p = el("p", "block");
      p.appendChild(el("span", "time", clockTime(b.t)));
      p.appendChild(document.createTextNode(b.text));
      page.appendChild(p);
    });

    var keep = el("button", "btn primary", "Keep");
    keep.onclick = keepConversation;
    keep.disabled = !blocks.length;

    var del = el("button", "btn danger", "Delete");
    del.onclick = deleteConversation;

    actions.appendChild(keep);
    actions.appendChild(del);
    footnote.textContent = "Keep saves it on this phone. Delete throws the transcript away for good.";
  }

  function renderSaved() {
    var list = loadJSON(SAVED_KEY, []) || [];
    page.appendChild(el("h2", null, list.length ? "Kept conversations" : "Nothing kept yet"));
    if (!list.length) {
      page.appendChild(el("p", "meta", "Conversations you choose to keep will be listed here."));
    }

    list.forEach(function (item) {
      var card = el("div", "saved-item");
      card.appendChild(el("h3", null, fullDate(item.startedAt)));
      var text = joinBlocks(item.blocks);
      card.appendChild(el("p", "snip",
        durationLabel(item.startedAt, item.endedAt) + " · " + wordCount(text) + " words — " +
        text.slice(0, 120) + (text.length > 120 ? "…" : "")));

      var full = el("div", "fold");
      (item.blocks || []).forEach(function (b) {
        full.appendChild(el("p", null, clockTime(b.t) + " — " + b.text));
      });

      var acts = el("div", "saved-actions");

      var open = el("button", "mini", "Read it");
      open.onclick = function () {
        var isOpen = full.classList.toggle("open");
        open.textContent = isOpen ? "Close" : "Read it";
      };

      var copy = el("button", "mini", "Copy text");
      copy.onclick = function () {
        if (!navigator.clipboard) { copy.textContent = "Not available"; return; }
        navigator.clipboard.writeText(text).then(function () {
          copy.textContent = "Copied";
          setTimeout(function () { copy.textContent = "Copy text"; }, 1800);
        }).catch(function () { copy.textContent = "Could not copy"; });
      };

      var drop = el("button", "mini warn", "Delete");
      drop.onclick = function () {
        if (drop.dataset.armed !== "1") {
          drop.dataset.armed = "1";
          drop.textContent = "Tap again to delete";
          setTimeout(function () {
            if (drop.dataset.armed === "1") { drop.dataset.armed = ""; drop.textContent = "Delete"; }
          }, 4000);
          return;
        }
        var rest = (loadJSON(SAVED_KEY, []) || []).filter(function (x) { return x.id !== item.id; });
        saveJSON(SAVED_KEY, rest);
        render();
      };

      acts.appendChild(open);
      acts.appendChild(copy);
      acts.appendChild(drop);
      card.appendChild(acts);
      card.appendChild(full);
      page.appendChild(card);
    });

    var back = el("button", "btn primary", "Start a new conversation");
    back.onclick = function () { startListening(); };
    actions.appendChild(back);

    var home = el("button", "btn quiet", "Back");
    home.onclick = function () { VIEW = "idle"; render(); };
    actions.appendChild(home);
  }

  /* ---------------- wiring ---------------- */
  document.getElementById("bigger").onclick = function () {
    prefs.size = Math.min(72, prefs.size + 4); applyPrefs();
  };
  document.getElementById("smaller").onclick = function () {
    prefs.size = Math.max(18, prefs.size - 4); applyPrefs();
  };
  gear.onclick = function () {
    var open = settings.classList.toggle("open");
    gear.setAttribute("aria-expanded", open ? "true" : "false");
  };
  langSel.onchange = function () {
    prefs.lang = langSel.value;
    applyPrefs();
    if (wantListening) { stopListening(); startListening(); }
  };
  themeSel.onchange = function () { prefs.theme = themeSel.value; applyPrefs(); };
  document.getElementById("viewSaved").onclick = function () {
    settings.classList.remove("open");
    gear.setAttribute("aria-expanded", "false");
    if (VIEW === "listening" && blocks.length) return;
    VIEW = "saved";
    render();
  };

  main.addEventListener("scroll", function () {
    var atBottom = main.scrollHeight - main.scrollTop - main.clientHeight < 60;
    stickToBottom = atBottom;
    var jump = document.getElementById("jump");
    if (jump) jump.classList.toggle("show", !atBottom);
  });

  window.addEventListener("beforeunload", function (e) {
    if (blocks.length && VIEW !== "saved") { e.preventDefault(); e.returnValue = ""; }
  });

  applyPrefs();
  setStatus("Ready", "");
  render();
})();
</script>
</body>
</html>
